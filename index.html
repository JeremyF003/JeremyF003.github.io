<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Jeremy Fernandez | Electrical Engineering Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" defer></script>
    <style>
        /* ===== GLOBAL RESET & THEME ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 40%, rgba(0, 255, 255, 0.03) 0%, transparent 60%);
            color: #eef5ff;
            line-height: 1.5;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0c10;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a6f8f;
            border-radius: 10px;
        }

        /* ===== INTRO FULLSCREEN ===== */
        #intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: radial-gradient(ellipse at center, #0a1420 0%, #000000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .intro-container {
            text-align: center;
            border-right: 2px solid #0ff;
            padding-right: 20px;
        }

        #intro-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.3rem;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff, #3cc7ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .glow-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #0ff;
            border-radius: 50%;
            box-shadow: 0 0 12px #0ff;
            animation: pulseDot 1.3s infinite;
            margin-left: 12px;
        }

        @keyframes pulseDot {
            0% {
                opacity: 0.3;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .fade-out {
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.23, 1, 0.32, 1);
            pointer-events: none;
        }

        #main-content {
            opacity: 0;
            transition: opacity 1.2s ease-out;
        }

        /* ===== STICKY TREE NAV ===== */
        #tree-nav {
            position: sticky;
            top: 0;
            z-index: 999;
            background: rgba(3, 8, 14, 0.97);
            border-bottom: 1px solid rgba(0, 200, 255, 0.15);
            padding: 14px 5% 10px;
            display: flex;
            justify-content: center;
        }

        .tree-container {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            flex-wrap: wrap;
            gap: 4px 16px;
            max-width: 1200px;
            width: 100%;
            padding: 6px 0 10px;
        }

        .tree-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 40px;
            border: 1px solid transparent;
            min-width: 70px;
            transition: background 0.25s, border-color 0.25s;
        }

        .tree-node:hover {
            background: rgba(0, 200, 255, 0.06);
            border-color: rgba(0, 200, 255, 0.2);
        }

        .tree-node.active {
            background: rgba(0, 200, 255, 0.12);
            border-color: rgba(0, 255, 255, 0.4);
        }

        .tree-node .node-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: #8ab8e0;
            text-align: center;
            line-height: 1.3;
            padding: 4px 2px;
        }

        .tree-node .node-icon {
            font-size: 1.15rem;
            margin-bottom: 2px;
            display: block;
            filter: grayscale(0.3);
        }

        .tree-node:hover .node-label,
        .tree-node.active .node-label {
            color: #ffffff;
        }
        .tree-node:hover .node-icon,
        .tree-node.active .node-icon {
            filter: grayscale(0);
        }

        @media (min-width: 780px) {
            .tree-container {
                flex-wrap: nowrap;
                gap: 0 4px;
            }
            .tree-node {
                flex-direction: row;
                gap: 6px;
                padding: 6px 16px 6px 12px;
                border-radius: 40px;
                min-width: auto;
            }
            .tree-node .node-icon {
                font-size: 1rem;
                margin-bottom: 0;
            }
            .tree-node .node-label {
                font-size: 0.7rem;
            }
            .tree-node::after {
                content: '';
                position: absolute;
                right: -10px;
                top: 50%;
                transform: translateY(-50%);
                width: 12px;
                height: 2px;
                background: linear-gradient(to right, rgba(0, 200, 255, 0.3), rgba(0, 200, 255, 0.05));
                border-radius: 2px;
            }
            .tree-node:last-child::after {
                display: none;
            }
            .tree-node::before {
                content: '';
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: rgba(0, 200, 255, 0.3);
                flex-shrink: 0;
                align-self: center;
                transition: background 0.3s;
                margin-right: 2px;
            }
            .tree-node.active::before,
            .tree-node:hover::before {
                background: #0ff;
            }
            .tree-node.root-node::before {
                background: #0ff;
                width: 8px;
                height: 8px;
            }
            .tree-node.root-node .node-label {
                color: #c4edff;
                font-weight: 600;
            }
        }

        /* ===== NEXT SECTION BUTTON ===== */
        .next-section-btn {
            display: block;
            width: fit-content;
            margin: 30px auto 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #8ab8e0;
            background: rgba(0, 20, 30, 0.6);
            border: 1px solid rgba(0, 200, 255, 0.3);
            padding: 10px 32px;
            border-radius: 60px;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s, color 0.3s, transform 0.3s;
            text-decoration: none;
            text-align: center;
        }

        .next-section-btn:hover {
            background: rgba(0, 200, 255, 0.15);
            border-color: #0ff;
            color: #fff;
            transform: translateY(-3px);
        }

        /* ===== HERO ===== */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 6% 60px;
        }

        .hero-center {
            display: flex;
            gap: 70px;
            max-width: 1300px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .hero-left {
            flex: 1;
            min-width: 240px;
            display: flex;
            justify-content: center;
        }

        .profile-pic {
            width: 340px;
            height: 340px;
            object-fit: cover;
            border-radius: 32px;
            border: 2px solid rgba(0, 255, 255, 0.4);
            box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.8);
            transition: transform 0.4s ease, filter 0.3s;
            filter: grayscale(0.1) contrast(1.05);
            will-change: transform;
        }

        .profile-pic:hover {
            transform: scale(1.02);
            filter: grayscale(0) contrast(1.1);
            border-color: #0ff;
        }

        .hero-right {
            flex: 2;
            background: rgba(12, 20, 28, 0.92);
            border-radius: 32px;
            padding: 40px 42px;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        #typing-name {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(120deg, #ffffff, #7bc5ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 18px;
            letter-spacing: -0.5px;
        }

        .about {
            font-size: 1.05rem;
            line-height: 1.65;
            color: #cdd9ff;
            margin-bottom: 24px;
        }

        .badge-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 18px 0 12px;
        }

        .eng-badge {
            background: rgba(0, 200, 255, 0.12);
            border: 1px solid rgba(0, 200, 255, 0.35);
            border-radius: 40px;
            padding: 5px 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 0.4px;
            color: #9eeaff;
        }

        .scroll-down {
            margin-top: 32px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 22px;
            border-radius: 60px;
            transition: background 0.25s, border-color 0.25s;
            border: 1px solid rgba(0, 255, 255, 0.3);
            text-decoration: none;
            color: #eef5ff;
        }

        .scroll-down span {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .scroll-down:hover {
            background: rgba(0, 200, 255, 0.15);
            border-color: #0ff;
        }

        .arrow {
            width: 18px;
            height: 18px;
            border-left: 2px solid #0ff;
            border-bottom: 2px solid #0ff;
            transform: rotate(-45deg);
            animation: bounceArrow 1.6s infinite;
        }

        @keyframes bounceArrow {
            0% {
                transform: rotate(-45deg) translate(0, 0);
                opacity: 0.6;
            }
            50% {
                transform: rotate(-45deg) translate(4px, 4px);
                opacity: 1;
            }
            100% {
                transform: rotate(-45deg) translate(0, 0);
                opacity: 0.6;
            }
        }

        /* ============================================================
           PROJECTS – GRID LAYOUT
           ============================================================ */
        #projects {
            padding: 40px 5% 60px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 40px;
            letter-spacing: -0.02em;
            border-left: 5px solid #0ff;
            padding-left: 25px;
            background: linear-gradient(135deg, #fff, #6bc2ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 28px;
            margin-top: 10px;
            content-visibility: auto;
        }

        .project-card {
            background: rgba(8, 14, 20, 0.97);
            border-radius: 28px;
            border: 1px solid rgba(0, 180, 250, 0.25);
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 400px;
            contain: content;
        }

        .project-card:hover {
            transform: translateY(-6px);
            border-color: rgba(0, 210, 255, 0.6);
        }

        .project-card.idea {
            border: 2px dashed rgba(0, 200, 255, 0.3);
            opacity: 0.8;
        }

        .project-card.idea:hover {
            border-color: rgba(0, 200, 255, 0.6);
            opacity: 1;
        }

        .project-card .idea-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 200, 255, 0.15);
            border: 1px solid rgba(0, 200, 255, 0.4);
            border-radius: 40px;
            padding: 2px 12px;
            font-size: 0.6rem;
            font-family: 'JetBrains Mono', monospace;
            color: #8ab8e0;
            letter-spacing: 0.5px;
            z-index: 2;
        }

        /* Image wrapper: no fixed height, image defines it */
        .project-card .img-wrapper {
            flex-shrink: 0;
            background: #0a1018;
            position: relative;
            overflow: hidden;
            min-height: 120px;
        }

        .project-card .project-img {
            width: 100%;
            height: auto;
            max-height: 320px;
            display: block;
            object-fit: contain;
            background: #0a1018;
        }

        .project-card .card-content {
            padding: 18px 22px 22px;
            display: flex;
            flex-direction: column;
            flex: 1;
            background: rgba(8, 14, 20, 0.97);
            gap: 4px;
            color: #eef5ff;
        }

        .project-card .project-title-sm {
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.2;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .project-card .project-meta-sm {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: #8bb9fe;
            border-left: 2px solid #0ff;
            padding-left: 10px;
            margin-bottom: 6px;
        }

        .project-card .project-tags-sm {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .project-card .project-tags-sm span {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.55rem;
            background: rgba(0, 200, 255, 0.1);
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid rgba(0, 200, 255, 0.25);
            color: #b3e4ff;
        }

        .project-card .project-desc-sm {
            font-size: 0.8rem;
            line-height: 1.5;
            color: #cdd9ff;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .project-card .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
            align-items: center;
        }

        .project-card .project-link-sm,
        .project-card .learn-more-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            padding: 4px 16px;
            border-radius: 40px;
            display: inline-block;
            text-decoration: none;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
            width: fit-content;
            align-self: flex-start;
            border: 1px solid #2f8fbf;
            color: #b6e6ff;
            background: transparent;
            cursor: pointer;
        }

        .project-card .project-link-sm:hover {
            background: #0ff;
            color: #000;
            border-color: #0ff;
        }

        .project-card .learn-more-btn {
            border-color: rgba(0, 200, 255, 0.4);
            color: #8ab8e0;
            background: rgba(0, 200, 255, 0.05);
        }

        .project-card .learn-more-btn:hover {
            background: rgba(0, 200, 255, 0.15);
            border-color: #0ff;
            color: #fff;
        }

        /* ============================================================
           PROJECT DETAIL MODAL
           ============================================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: modalFadeIn 0.3s ease;
        }

        .modal-overlay.open {
            display: flex;
        }

        @keyframes modalFadeIn {
            0% {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-content {
            background: rgba(10, 18, 28, 0.99);
            border-radius: 32px;
            border: 1px solid rgba(0, 210, 255, 0.3);
            max-width: 850px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 40px 42px;
            position: relative;
            contain: content;
        }

        .modal-content::-webkit-scrollbar {
            width: 6px;
        }
        .modal-content::-webkit-scrollbar-thumb {
            background: #2a6f8f;
            border-radius: 10px;
        }

        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            background: rgba(0, 20, 30, 0.9);
            border: 1px solid rgba(0, 200, 255, 0.3);
            color: #c4edff;
            font-size: 1.8rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
            margin-bottom: 10px;
            z-index: 10;
        }

        .modal-close:hover {
            background: rgba(0, 200, 255, 0.2);
            border-color: #0ff;
            transform: rotate(90deg);
        }

        .modal-content .modal-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .modal-content .modal-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: #8bb9fe;
            border-left: 2px solid #0ff;
            padding-left: 14px;
            margin-bottom: 18px;
        }

        .modal-content .modal-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .modal-content .modal-tags span {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            background: rgba(0, 200, 255, 0.1);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(0, 200, 255, 0.25);
            color: #b3e4ff;
        }

        .modal-content .modal-image {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 16px;
            border: 1px solid rgba(0, 200, 255, 0.2);
            margin-bottom: 24px;
            background: #0a1018;
        }

        .modal-content .blog-section {
            margin-top: 8px;
        }

        .modal-content .blog-section h3 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #fff;
            margin: 28px 0 12px 0;
            border-left: 3px solid #0ff;
            padding-left: 14px;
        }

        .modal-content .blog-section h3:first-of-type {
            margin-top: 0;
        }

        .modal-content .blog-section p {
            font-size: 1rem;
            line-height: 1.7;
            color: #cdd9ff;
            margin-bottom: 16px;
        }

        .modal-content .blog-section .blog-image-placeholder {
            width: 100%;
            border-radius: 16px;
            border: 2px dashed rgba(0, 200, 255, 0.25);
            background: rgba(0, 20, 30, 0.4);
            padding: 30px 20px;
            text-align: center;
            margin: 16px 0 20px;
            color: #5a8aaa;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .modal-content .blog-section .blog-image-placeholder .icon {
            font-size: 2.5rem;
            opacity: 0.4;
        }

        .modal-content .blog-section .blog-image-placeholder .caption {
            font-size: 0.7rem;
            color: #4a7a9a;
            letter-spacing: 1px;
        }

        .modal-content .blog-section .note-box {
            background: rgba(0, 200, 255, 0.06);
            border-left: 3px solid #ffaa44;
            padding: 16px 20px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .modal-content .blog-section .note-box p {
            color: #f0e6d0;
            margin-bottom: 0;
            font-size: 0.95rem;
        }

        .modal-content .blog-section .note-box .highlight {
            color: #ffaa44;
            font-weight: 600;
        }

        .modal-content .blog-section .code-block {
            background: #0a0f1a;
            border: 1px solid rgba(0, 200, 255, 0.15);
            border-radius: 16px;
            padding: 16px 20px;
            margin: 16px 0 20px;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #d4e4ff;
        }

        .modal-content .blog-section .code-block code {
            font-family: 'JetBrains Mono', monospace;
            display: block;
            white-space: pre;
        }

        .modal-content .blog-section .code-block .kw {
            color: #ff79c6;
        }
        .modal-content .blog-section .code-block .type {
            color: #8be9fd;
        }
        .modal-content .blog-section .code-block .func {
            color: #50fa7b;
        }
        .modal-content .blog-section .code-block .comment {
            color: #6272a4;
            font-style: italic;
        }
        .modal-content .blog-section .code-block .num {
            color: #bd93f9;
        }
        .modal-content .blog-section .code-block .str {
            color: #f1fa8c;
        }
        .modal-content .blog-section .code-block .var {
            color: #f8f8f2;
        }

        .modal-content .modal-link {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: #b6e6ff;
            border: 1px solid #2f8fbf;
            padding: 6px 22px;
            border-radius: 40px;
            display: inline-block;
            text-decoration: none;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
            margin-top: 8px;
        }

        .modal-content .modal-link:hover {
            background: #0ff;
            color: #000;
            border-color: #0ff;
        }

        /* ============================================================
           TECHNICAL NOTES – hidden by default via JS
           ============================================================ */
        #technical-notes {
            padding: 30px 7% 70px;
            max-width: 1400px;
            margin: 0 auto;
            transition: opacity 0.3s ease;
        }

        #technical-notes.hidden {
            display: none;
        }

        .notes-book {
            background: rgba(6, 12, 18, 0.95);
            border-radius: 32px;
            border: 1px solid rgba(0, 200, 255, 0.25);
            overflow: hidden;
            margin-top: 20px;
        }

        .notes-header {
            width: 100%;
            background: rgba(0, 30, 45, 0.9);
            border: none;
            border-bottom: 1px solid rgba(0, 180, 255, 0.4);
            padding: 20px 28px;
            font-size: 1.7rem;
